name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.0) to publish a GitHub Release'
        required: false
        default: ''
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install web dependencies & build Android bundle
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
          ANDROID_BUILD=true npm run build
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -r dist/. app/src/main/assets/www/

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK (API 35, Build-Tools 35.0.0 & local.properties)
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "ERROR: Android SDK directory not found: $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties

          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android Command-Line Tools..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-extract/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-extract
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          KS_FILE="$RUNNER_TEMP/keystore/arna-release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KS_FILE"
            echo "ARNA_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ARNA_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ARNA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ARNA_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$KS_FILE" \
              -storepass "ArnaTunnelRelease2026" \
              -alias "arnatunnel" \
              -keypass "ArnaTunnelRelease2026" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Arna tunnel, OU=Mobile, O=Arna, L=Algiers, ST=DZ, C=DZ"
            echo "ARNA_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ARNA_KEYSTORE_PASSWORD=ArnaTunnelRelease2026" >> "$GITHUB_ENV"
            echo "ARNA_KEY_ALIAS=arnatunnel" >> "$GITHUB_ENV"
            echo "ARNA_KEY_PASSWORD=ArnaTunnelRelease2026" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify & Stage APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/Arna-tunnel-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/Arna-tunnel-release.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-apks/Arna-tunnel-release.apk
          fi
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose release-apks/Arna-tunnel-debug.apk
            "$APKSIGNER" verify --verbose release-apks/Arna-tunnel-release.apk
          fi
          ls -lh release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Arna-tunnel-debug-apk
          path: release-apks/Arna-tunnel-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Arna-tunnel-release-apk
          path: release-apks/Arna-tunnel-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              release-apks/Arna-tunnel-debug.apk \
              release-apks/Arna-tunnel-release.apk \
              --clobber
          else
            gh release create "$TAG_NAME" \
              release-apks/Arna-tunnel-debug.apk \
              release-apks/Arna-tunnel-release.apk \
              --title "Arna tunnel $TAG_NAME" \
              --generate-notes
          fi
